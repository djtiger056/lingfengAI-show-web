<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5fc" />
  <title>零风AI · 手机交互预览</title>
  <link rel="icon" href="../../assets/logo.jpg" />
  <link rel="stylesheet" href="./phone.css" />
  <script src="./phone.js" defer></script>
</head>
<body>
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-memory" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6V3Zm8 0v5h5M9 12h6M9 16h4" /></symbol>


    <symbol id="icon-moments" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="8" cy="8" r="1.5" /><path d="m3 17 6-6 4 4 3-3 5 5" /></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6" /></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v10M7 12h10" /></symbol>
    <symbol id="icon-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8 14a4.5 4.5 0 0 0 8 0M8 9h.01M16 9h.01" /></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>

    <symbol id="icon-voice" viewBox="0 0 24 24"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" /></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" /></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" /></symbol>
  </defs></svg>
  <main class="preview-layout">
    <div class="device-stage">
      <section class="phone-frame" aria-label="零风AI 手机模拟器">
        <div class="phone-screen">
          <div class="phone-base">
            <div class="device-status" aria-label="模拟手机状态栏"><time>23:49</time><span class="dynamic-island" aria-hidden="true"></span><div class="status-icons" aria-hidden="true"><svg viewBox="0 0 20 14"><path d="M1 13h2V9H1zm5 0h2V6H6zm5 0h2V3h-2zm5 0h2V0h-2z" /></svg><svg viewBox="0 0 20 14"><path d="M1 4a14 14 0 0 1 18 0M4 7a9 9 0 0 1 12 0M7 10a4.5 4.5 0 0 1 6 0" /><circle cx="10" cy="13" r="1" /></svg><span class="battery"></span></div></div>
            <header class="chat-header"><img id="roleAvatar" src="../../assets/avatars/shen-yu.webp" alt="沈屿的角色头像" width="44" height="44" /><div class="chat-person"><strong id="roleName">沈屿</strong><span id="chatStatus">在线 · 陪你聊会儿</span></div><button type="button" id="memoryButton" class="presence-chip" aria-haspopup="dialog">关于你的记忆</button><button type="button" id="moreButton" class="icon-button more-button" aria-label="更多演示功能与角色切换" aria-haspopup="dialog">···</button></header>
            <div class="chat-scroll" id="chatScroll" tabindex="0" role="log" aria-label="预设聊天消息" aria-live="off">
              <div class="chat-day"><span>今天 · 对话示例</span></div>
              <div id="messages">
                <article class="bubble bubble-me"><p>终于忙完了，你在干嘛？</p><small>23:47 · 已读</small></article>
                <article class="bubble bubble-ta"><p>我也刚忙完，给你看看我的桌面。</p><img class="sample-image sample-image--scene" src="../../assets/avatars/desk-scene.png" alt="沈屿发的桌面照片" width="160" height="180" /><small>AI 图片 · 23:48</small></article>
                <article class="bubble bubble-me"><p>有点困，想喝杯拿铁。</p><small>23:49 · 已读</small></article>
                <article class="bubble bubble-ta"><p>那就不加糖，记得你上次说太甜会腻。</p><audio controls preload="none" src="../../assets/coffee-voice.wav" aria-label="播放语音消息：这么晚还喝咖啡呀"></audio><small>记得你的小习惯 · 23:49</small></article>
              </div>
            </div>
            <div class="chat-dock">
              <div class="quick-prompts" role="group" aria-label="接着聊聊"><button type="button" data-prompt="也想看看你。">也想看看你</button><button type="button" data-prompt="想听你说说话。">想听你说说话</button><button type="button" data-prompt="你还记得呀。">你还记得呀</button></div>
              <form id="messageForm" class="composer"><button type="button" id="toolsButton" class="icon-button" aria-label="打开功能面板" aria-haspopup="dialog"><svg class="icon"><use href="#icon-plus" /></svg></button><label class="sr-only" for="messageInput">发送消息，仅用于本地演示</label><input id="messageInput" type="text" placeholder="发送消息…" maxlength="240" autocomplete="off" enterkeyhint="send" /><button type="button" id="emojiButton" class="icon-button" aria-label="添加微笑表情"><svg class="icon"><use href="#icon-smile" /></svg></button><button type="submit" id="sendButton" aria-label="发送演示消息" disabled><svg class="icon"><use href="#icon-arrow" /></svg></button></form>
              <span class="local-demo-label">预设互动演示 · 非实时 AI 回复</span>
            </div>
            <div class="device-home" aria-hidden="true"><span></span></div>
          </div>
          <div class="sheet-overlay" id="sheetOverlay" hidden>
            <section class="feature-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"><div class="sheet-handle" aria-hidden="true"></div><header><div><span id="sheetEyebrow">零风 AI</span><h2 id="sheetTitle">关于你的记忆</h2></div><button type="button" id="closeSheet" class="icon-button" aria-label="关闭功能面板"><svg class="icon"><use href="#icon-close" /></svg></button></header><div id="sheetContent" class="sheet-content"></div><div id="sheetTools" hidden><p class="sheet-note">切换示例角色</p>      <div class="role-picker" role="group" aria-label="选择示例角色">
        <button type="button" data-role="0" aria-pressed="true"><img src="../../assets/avatars/shen-yu.webp" alt="" width="36" height="36" /><span>沈屿<small>男生 · 慢热</small></span></button>
        <button type="button" data-role="1" aria-pressed="false"><img src="../../assets/avatars/lin-yingying.webp" alt="" width="36" height="36" /><span>林莹莹<small>女生 · 友善</small></span></button>
      </div>
      <div class="playback-controls"><button id="replayButton" type="button">重播对话 <span aria-hidden="true">↻</span></button><button id="resetButton" type="button">重置</button></div>
</div></section>
          </div>
          <div id="toast" class="phone-toast" role="status" hidden></div>
        </div>
      </section>
      <p class="device-caption">零风 AI · 日常里的陪伴<br /><small>独立交互预览 · 图片、语音及过往记忆为演示素材</small></p>
    </div>
  </main>
  <span id="liveStatus" class="sr-only" role="status" aria-live="polite"></span>
  <noscript><p class="no-script">对话内容可直接查看；启用 JavaScript 后可切换角色和体验预设互动。</p></noscript>
</body>
</html>
